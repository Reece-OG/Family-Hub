services:
  db:
    image: postgres:16-alpine
    container_name: ${CONTAINER_PREFIX:-family-hub}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-familyhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-familyhub}
      POSTGRES_DB: ${POSTGRES_DB:-familyhub}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-familyhub} -d ${POSTGRES_DB:-familyhub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Baked into the build so NEXT_PUBLIC_APP_NAME reaches client bundles.
        NEXT_PUBLIC_APP_NAME: ${APP_NAME:-}
    container_name: ${CONTAINER_PREFIX:-family-hub}-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-familyhub}:${POSTGRES_PASSWORD:-familyhub}@db:5432/${POSTGRES_DB:-familyhub}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-to-a-long-random-string}
      NODE_ENV: production
      # Set to "true" ONLY when serving over HTTPS (behind a reverse proxy
      # like Caddy / Nginx / Cloudflare). On plain-HTTP LAN deployments
      # this MUST stay blank/false or the browser silently drops the
      # session cookie and login will bounce back to the login screen.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # Branding — shown in nav, login, titles, PDFs, reminder emails.
      # Leave blank to fall back to "Family Hub".
      APP_NAME: ${APP_NAME:-}
      NEXT_PUBLIC_APP_NAME: ${APP_NAME:-}
      # Seed values used on first boot to create the bootstrap parent
      SEED_PARENT_EMAIL: ${SEED_PARENT_EMAIL:-parent@example.com}
      SEED_PARENT_PASSWORD: ${SEED_PARENT_PASSWORD:-changeme}
      SEED_PARENT_NAME: ${SEED_PARENT_NAME:-Parent}
      # Where uploaded photos live. Must match the mount below.
      UPLOADS_DIR: /app/uploads
      # In-app update feature: the web container touches trigger files here
      # and reads JSON status files written by the host's systemd units.
      # Only populated on Family-Hub-LXC installs (the installer creates the
      # host directory + systemd path units). On bare docker-compose installs
      # the directory still exists but the update endpoints will just report
      # that no host-side updater is present.
      FAMILY_HUB_STATE_DIR: /var/lib/family-hub/state
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      # Photos are written to /app/uploads/photos/ — persists across rebuilds.
      - uploads:/app/uploads
      # Bind-mounted from the LXC host so the privileged state-helper.sh (run
      # by systemd as root) and the unprivileged web container can exchange
      # trigger/status files. Directory is created by setup-docker.sh with
      # ownership matching the container's nextjs UID (1001).
      - /var/lib/family-hub/state:/var/lib/family-hub/state

volumes:
  db_data:
  uploads:
